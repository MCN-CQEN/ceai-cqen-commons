name: "Clone repository configuration"
description: "Clone un repository GitHub et copie ses variables et environnements (fork if possible)"

inputs:

  source_repo:
    description: "Repository source, ex: org/source-repo"
    required: true

  target_repo:
    description: "Repository cible, ex: org/target-repo"
    required: true

  github_token:
    description: "Token GitHub avec permissions suffisantes"
    required: true

runs:
  using: composite

  steps:
    - name: Fork source repository (if possible)
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        SOURCE_REPO: ${{ inputs.source_repo }}
        TARGET_REPO: ${{ inputs.target_repo }}
      run: |
        set -euo pipefail

        TARGET_OWNER="${TARGET_REPO%%/*}"
        TARGET_NAME="${TARGET_REPO##*/}"
        SOURCE_OWNER="${SOURCE_REPO%%/*}"
        SOURCE_NAME="${SOURCE_REPO##*/}"

        if gh repo view "${TARGET_REPO}" >/dev/null 2>&1; then
          echo "Repository ${TARGET_REPO} already exists; skipping fork."
        else
          echo "Attempting to fork ${SOURCE_REPO} into ${TARGET_OWNER}..."

          # Try to fork into the target owner (organization). If target owner is the authenticated user,
          # POST without organization is acceptable — but passing organization will attempt org fork.
          gh api --method POST "/repos/${SOURCE_REPO}/forks" -f organization="${TARGET_OWNER}" || true

          # Wait for the fork to appear (fork creation is asynchronous)
          for i in $(seq 1 30); do
            if gh repo view "${TARGET_REPO}" >/dev/null 2>&1; then
              echo "Fork available: ${TARGET_REPO}"
              break
            fi
            sleep 2
          done

          if ! gh repo view "${TARGET_REPO}" >/dev/null 2>&1; then
            echo "Fork did not appear. Will fall back to cloning/pushing the source repository."
            exit 1
          else
            echo "Fork did appear."
          fi
        fi

