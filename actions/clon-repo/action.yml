    # Variables

    - name: Copy repository variables
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        SOURCE_REPO: ${{ inputs.source_repo }}
        TARGET_REPO: ${{ inputs.target_repo }}
      run: |
        set -euo pipefail

        gh api \
          "/repos/${SOURCE_REPO}/actions/variables" \
          --paginate \
          --jq '.variables[] | [.name,.value] | @tsv' |
        while IFS=$'\t' read -r NAME VALUE; do

          echo "Copy repository variable: ${NAME}"

          gh variable set "${NAME}" \
            --repo "${TARGET_REPO}" \
            --body "${VALUE}"

        done

    - name: Copy environments and environment variables
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        SOURCE_REPO: ${{ inputs.source_repo }}
        TARGET_REPO: ${{ inputs.target_repo }}
      run: |
        set -euo pipefail

        ENVIRONMENTS=$(
          gh api \
            "/repos/${SOURCE_REPO}/environments" \
            --paginate \
            --jq '.environments[].name'
        )

        while IFS= read -r ENV_NAME; do
          [[ -z "${ENV_NAME}" ]] && continue

          echo "Create environment: ${ENV_NAME}"

          ENCODED_ENV="$(
            printf '%s' "${ENV_NAME}" |
            jq -sRr @uri
          )"

          gh api \
            --method PUT \
            "/repos/${TARGET_REPO}/environments/${ENCODED_ENV}"

          echo "Copy variables from ${ENV_NAME}"

          gh api \
            "/repos/${SOURCE_REPO}/environments/${ENCODED_ENV}/variables" \
            --paginate \
            --jq '.variables[] | [.name,.value] | @tsv' |
          while IFS=$'\t' read -r NAME VALUE; do

            echo "Copy environment variable: ${ENV_NAME}/${NAME}"

            gh variable set "${NAME}" \
              --repo "${TARGET_REPO}" \
              --env "${ENV_NAME}" \
              --body "${VALUE}"

          done

        done <<< "${ENVIRONMENTS}"


    # Secrets

    - name: Copy repository secret names with values to be configured
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        SOURCE_REPO: ${{ inputs.source_repo }}
        TARGET_REPO: ${{ inputs.target_repo }}
      run: |
        set -euo pipefail

        echo "Copy repository secret names from ${SOURCE_REPO}"

        gh api \
          "/repos/${SOURCE_REPO}/actions/secrets" \
          --paginate \
          --jq '.secrets[].name' |
        while IFS= read -r SECRET_NAME; do
          [[ -z "${SECRET_NAME}" ]] && continue

          echo "Create empty repository secret: ${SECRET_NAME}"

          gh secret set "${SECRET_NAME}" \
            --repo "${TARGET_REPO}" \
            --body "TO_BE_CONFIGURED"
        done

    - name: Copy environment secret names with values to be configured
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        SOURCE_REPO: ${{ inputs.source_repo }}
        TARGET_REPO: ${{ inputs.target_repo }}
      run: |
        set -euo pipefail

        ENVIRONMENTS=$(
          gh api \
            "/repos/${SOURCE_REPO}/environments" \
            --paginate \
            --jq '.environments[].name'
        )

        while IFS= read -r ENV_NAME; do
          [[ -z "${ENV_NAME}" ]] && continue

          echo "Environment: ${ENV_NAME}"

          ENCODED_ENV="$(
            printf '%s' "${ENV_NAME}" |
            jq -sRr @uri
          )"

          gh api \
            "/repos/${SOURCE_REPO}/environments/${ENCODED_ENV}/secrets" \
            --paginate \
            --jq '.secrets[].name' |
          while IFS= read -r SECRET_NAME; do
            [[ -z "${SECRET_NAME}" ]] && continue

            echo "Create empty environment secret: ${ENV_NAME}/${SECRET_NAME}"

            gh secret set "${SECRET_NAME}" \
              --repo "${TARGET_REPO}" \
              --env "${ENV_NAME}" \
              --body "TO_BE_CONFIGURED"
          done
        done <<< "${ENVIRONMENTS}"